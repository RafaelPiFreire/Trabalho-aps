<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Cadastro de Currículo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    
    <style>
        .error { 
            color: #dc3545; 
            font-size: 0.9rem; 
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <a class="navbar-brand" href="index.html">Home</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html"><i class="bi bi-house"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="piadas.html"><i class="bi bi-emoji-laughing"></i> Piadas</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="curriculo.html"><i class="bi bi-file-text"></i> Currículo</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="bi bi-person-lines-fill"></i> Cadastro de Currículo</h4>
                    </div>
                    <div class="card-body">
                        <form id="formCurriculo">
                            
                            <div class="form-row">
                                <div class="form-group col-md-8">
                                    <label for="nome">Nome Completo</label>
                                    <input type="text" class="form-control" id="nome" name="nome">
                                </div>
                                <div class="form-group col-md-4">
                                    <label for="idade">Idade</label>
                                    <input type="number" class="form-control" id="idade" name="idade">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" class="form-control" id="email" name="email">
                            </div>

                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="telefone">Telefone</label>
                                    <input type="text" class="form-control" id="telefone" name="telefone">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="cpf">CPF</label>
                                    <input type="text" class="form-control" id="cpf" name="cpf">
                                </div>
                            </div>

                            <!-- Campo corrigido: Área de Interesse agora é SELECT -->
                            <div class="form-group">
                                <label for="area">Área de Interesse</label>
                                <textarea class="form-control" id="area" name="area" rows="1"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="experiencia">Experiência Profissional</label>
                                <textarea class="form-control" id="experiencia" name="experiencia" rows="5"></textarea>
                            </div>

                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="senha">Senha</label>
                                    <input type="password" class="form-control" id="senha" name="senha">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="confirmar">Confirmar Senha</label>
                                    <input type="password" class="form-control" id="confirmar" name="confirmar">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success btn-lg btn-block mt-4">
                                <i class="bi bi-save"></i> Enviar Currículo
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/additional-methods.min.js"></script>
    <script src="https://igorescobar.github.io/jQuery-Mask-Plugin/js/jquery.mask.min.js"></script>
    <script src="js/curriculo.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
</body>
</html>
